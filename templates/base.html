<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Igarapé Vivo{% endblock %}</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="topo">
        <h1 class="logo">Igarapé Vivo</h1>
        <nav class="nav">
            <a href="{{ url_for('index') }}" class="{{ 'ativo' if request.endpoint == 'index' }}">Mapa</a>
            <a href="{{ url_for('nova') }}" class="{{ 'ativo' if request.endpoint == 'nova' }}">Nova ocorrência</a>
        </nav>
    </header>

    <main class="conteudo">
        {% block conteudo %}{% endblock %}
    </main>

    <footer class="rodape">
        Monitoramento colaborativo de resíduos em corpos d'água urbanos
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
