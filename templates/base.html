<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Igarapé Vivo{% endblock %}</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="topo">
        <h1 class="logo">Igarapé Vivo</h1>
<nav class="nav">
    <a href="{{ url_for('pages.index') }}" class="{{ 'ativo' if request.endpoint == 'pages.index' }}">Mapa</a>
    <a href="{{ url_for('pages.dashboard') }}" class="{{ 'ativo' if request.endpoint == 'pages.dashboard' }}">Dashboard</a>
    <a href="{{ url_for('pages.nova') }}" class="{{ 'ativo' if request.endpoint == 'pages.nova' }}">Nova ocorrência</a>
    {% if current_user %}
        <span class="nav-user">{{ current_user.nome }} ({{ current_user.perfil }})</span>
        <a href="#" id="link-logout" class="{{ 'ativo' if request.endpoint == 'pages.logout' }}">Sair</a>
    {% else %}
        <a href="{{ url_for('pages.login') }}" class="{{ 'ativo' if request.endpoint == 'pages.login' }}">Login</a>
    {% endif %}
</nav>
    </header>

    <main class="conteudo">
        {% block conteudo %}{% endblock %}
    </main>

    <footer class="rodape">
        Monitoramento colaborativo de resíduos em corpos d'água urbanos
    </footer>

    {% block scripts %}{% endblock %}
<script>
document.getElementById('link-logout')?.addEventListener('click', async (e) => {
    e.preventDefault();
    await fetch('/logout', { method: 'POST' });
    window.location.href = '/';
});
</script>
</body>
</html>
